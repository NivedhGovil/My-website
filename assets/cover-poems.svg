<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340"
     role="img" aria-label="Six short lines of verse, uneven in length">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#9c5361"/>
      <stop offset="100%" stop-color="#733d48"/>
    </linearGradient>
    <pattern id="rule" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <path d="M0 0 H9" stroke="#ffffff" stroke-width="1" opacity="0.07"/>
    </pattern>
    <radialGradient id="vig" cx="0.32" cy="0.3" r="0.95">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
  </defs>

  <rect width="800" height="340" fill="url(#g)"/>
  <rect width="800" height="340" fill="url(#rule)"/>
  <rect width="800" height="340" fill="url(#vig)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 118 H 450" stroke="rgba(255,255,255,.45)" stroke-width="5.5"/>
    <path d="M300 143 H 510" stroke="#f3e1e4" stroke-width="5.5"/>
    <path d="M300 168 H 420" stroke="rgba(255,255,255,.45)" stroke-width="5.5"/>
    <path d="M300 193 H 486" stroke="#f3e1e4" stroke-width="5.5"/>
    <path d="M300 218 H 396" stroke="rgba(255,255,255,.45)" stroke-width="5.5"/>
    <path d="M300 243 H 468" stroke="rgba(255,255,255,.45)" stroke-width="5.5"/>
  </g>
</svg>
