    <path d="M292 206 L 346 172 L 400 220 L 454 148 L 508 186" stroke="#f1e8d7" stroke-width="5"/>
    <circle cx="454" cy="148" r="9" fill="#f1e8d7" stroke="none"/>
  </g>
